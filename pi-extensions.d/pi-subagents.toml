# tintinweb/pi-subagents: sub-agents and workflows for pi, like those of
# Claude Code (parallel agents, custom agent types, a live view). It has npm
# dependencies, so the install needs npm on the host.
# A sub-agent can get a git worktree in /tmp of the box. This occurs only if
# the model or an agent file asks for isolation "worktree" (default: off).
# Then the extension commits the changes of that sub-agent
# (git commit --no-verify) on a new branch pi-agent-<id> in your repo. To
# prevent this in a repo, put { "worktreeIsolation": false } in its
# .pi/subagents.json.
# Enable with AB_PI_EXTENSIONS=pi-subagents (README, pi extensions).
url = "https://github.com/tintinweb/pi-subagents"
