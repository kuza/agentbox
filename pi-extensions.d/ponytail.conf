# DietrichGebert/ponytail: adds the ponytail rules to the system prompt of
# pi at each turn, with /ponytail lite|full|ultra|off and a status line
# entry. /ponytail-review and the other commands start the skills of the
# same name: enable the skill source too (AB_SKILLS=ponytail). NEEDS_SKILLS
# makes the start of pi warn without it. No npm dependencies.
# Enable with AB_PI_EXTENSIONS=ponytail (README, pi extensions).
URL=https://github.com/DietrichGebert/ponytail
NEEDS_SKILLS=ponytail
