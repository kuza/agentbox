# Egress proxy for the agent containers: settings and access rules.
# Everything not allowed is denied (HTTP 403 from the proxy).
http_port 3128

# The allowed hosts come from a file run.sh generates on every start: the
# egress groups enabled with AB_EGRESS (egress.d/, egress.local.d/: the
# agents' APIs, PyPI, Go modules, ...) and the MCP modules' remote hosts.
# Do not remove. To allow a host, add a group in egress.local.d/ instead of
# editing this file (README, Egress).
include /etc/squid/agentbox-allow.conf

acl SSL_ports port 443
acl HTTP_ports port 80
acl CONNECT method CONNECT

# Allowed hosts: HTTPS on 443, plain HTTP on 80. Other ports only through a
# host:port entry of an egress group, whose rule comes from the include above.
http_access deny CONNECT !SSL_ports
http_access deny !CONNECT !HTTP_ports
http_access allow allowed
http_access deny all

# Inspect denials:
#   podman exec ab-egress tail -f /var/log/squid/access.log | grep DENIED
access_log /var/log/squid/access.log
# Exit within a second on stop instead of waiting 30 s for open connections:
# run.sh recreates squid when its config changes, and podman kills it after 10 s.
shutdown_lifetime 1 seconds
# No ICMP pinger: it cannot open raw sockets in the container anyway.
pinger_enable off
cache deny all
