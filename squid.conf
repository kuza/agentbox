# Egress allowlist for the Claude container.
# Everything not listed here is denied (HTTP 403 from the proxy).
http_port 3128

# Required by Claude Code (see https://code.claude.com/docs/en/network-config):
#   api.anthropic.com    model API, feature flags
#   platform.claude.com  OAuth token exchange/refresh/revocation (all account types)
#   claude.ai            claude.ai account authentication
acl allowed dstdomain api.anthropic.com
acl allowed dstdomain platform.claude.com
acl allowed dstdomain claude.ai
# Python packages (pip / uv). Remove these two lines to stop the agent from
# installing packages; dependencies then have to be added from the host.
acl allowed dstdomain pypi.org
acl allowed dstdomain files.pythonhosted.org

# Go modules: module proxy and checksum database. Remove to stop the agent
# from fetching modules (vendor them, or run `go mod download` elsewhere).
acl allowed dstdomain proxy.golang.org
acl allowed dstdomain sum.golang.org

# pi with a ChatGPT subscription, provider "OpenAI" -> "Sign in with ChatGPT":
# sign-in and token refresh (auth.openai.com), model API (api.openai.com).
# Not needed for Claude Code, or for pi with an API key (that goes through
# ab-llm-openai, which has its own egress).
acl allowed dstdomain auth.openai.com
acl allowed dstdomain api.openai.com
# Only for pi's legacy "OpenAI Codex (legacy)" provider (ChatGPT backend):
#acl allowed dstdomain chatgpt.com

# GitHub is NOT reachable from the Claude container by default. Authenticated
# GitHub access goes through the github MCP sidecar, which has its own egress.
#
# Optional anonymous READ access to public GitHub content: uncomment the lines
# below and run `AB_RESTART=1 ./run.sh`. There is no token in the container, so
# the agent cannot push or post anything; squid sees only host names (CONNECT),
# so this cannot be restricted to GET requests. See README "GitHub read access".
#   github.com                     web pages, git clone/fetch over HTTPS
#   codeload.github.com            archive downloads (.tar.gz/.zip), uv/pip git deps
#   raw.githubusercontent.com      raw files
#   objects.githubusercontent.com  release assets (redirect target)
#   release-assets.githubusercontent.com  release assets (newer redirect target)
#acl allowed dstdomain github.com
#acl allowed dstdomain codeload.github.com
#acl allowed dstdomain raw.githubusercontent.com
#acl allowed dstdomain objects.githubusercontent.com
#acl allowed dstdomain release-assets.githubusercontent.com

# Google Cloud Storage. Also accepts uploads with a token: a possible
# exfiltration path (README, Security model). Remove to close it.
acl allowed dstdomain storage.googleapis.com

# Remote MCP servers (Context7, ...): hosts from the enabled MCP modules,
# generated by run.sh (MCP_EGRESS in mcp/*/mcp.sh). Do not remove.
include /etc/squid/agentbox-mcp.conf

acl SSL_ports port 443
acl CONNECT method CONNECT

http_access deny CONNECT !SSL_ports
http_access allow allowed
http_access deny all

# Inspect denials:
#   podman exec ab-egress tail -f /var/log/squid/access.log | grep DENIED
access_log /var/log/squid/access.log
cache deny all
