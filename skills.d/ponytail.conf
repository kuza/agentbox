# DietrichGebert/ponytail (https://github.com/DietrichGebert/ponytail): a
# "lazy senior dev" prompt. Before it writes code, the agent looks for code
# that is already there (the repo, the standard library, the platform). It
# writes the minimum, and it keeps validation, security and tests. Skills:
# ponytail, ponytail-review (a review of the diff), ponytail-audit (the
# whole repo), ponytail-debt, ponytail-gain, ponytail-help.
# Only skills/: the repository also has copies of the skills for other
# agents. Installed without a prefix: the names already start with
# "ponytail-", and the pi extension ponytail calls them by these names.
# Enable with AB_SKILLS=ponytail (README, Skills).
URL=https://github.com/DietrichGebert/ponytail
SUBDIR=skills
PREFIX=
