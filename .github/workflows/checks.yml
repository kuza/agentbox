# Fast checks on every change: the tests with the podman stand-in, and
# shellcheck. No podman, no network beyond the checkout.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Tests (podman stand-in)
        run: ./tests/run.sh
      - name: Tests on a host with git-guard installed
        # As release.sh runs them on a maintainer's host: git in PATH is
        # git-guard, with a record of mounted repositories.
        run: |
          mkdir -p ~/.local/bin ~/.config/agentbox
          install -m 755 git-guard ~/.local/bin/git
          printf '%s\tnone\n' "$HOME/somewhere" > ~/.config/agentbox/mounted-repos
          PATH="$HOME/.local/bin:$PATH" timeout 300 ./tests/run.sh

  shellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        # lib/ and the modules are sourced by run.sh: their variables are
        # used across files (SC2034) and they have no shebang (SC2148).
        run: |
          shellcheck --version
          shellcheck -s bash -x -S warning -e SC2034,SC2148,SC1091 \
            run.sh pi.sh agentbox install.sh release.sh check-updates.sh sync-skills.sh git-guard lib/*.sh mcp/*/mcp.sh \
            completions/agentbox.bash \
            tests/escape.sh tests/stub/podman tests/stub/systemctl
