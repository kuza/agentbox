format = 1

[settings.GH_OWNERS]
list = true
check = "name"
lowercase = true

[secrets.pat]
help = "A token"

[secrets."pat_{item}"]
for_each = "GH_OWNERS"
help = "A token for {item}"

[[servers]]
for_each = "GH_OWNERS"
name = "github-{item}"
url = "http://ab-mcp-github:8080/o/{item}/mcp"
caller = true
