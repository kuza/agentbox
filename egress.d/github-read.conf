# Anonymous READ access to public GitHub content (README, GitHub read access (optional)).
# There is no token in the box, so the agent cannot push or post anything;
# squid sees only host names (CONNECT), so this cannot be restricted to GET
# requests. Authenticated GitHub access goes through the github MCP module.
github.com                            # web pages, git clone/fetch over HTTPS
codeload.github.com                   # archives (.tar.gz/.zip), uv/pip git deps
raw.githubusercontent.com             # raw files
objects.githubusercontent.com         # release assets (redirect target)
release-assets.githubusercontent.com  # release assets (newer redirect target)
