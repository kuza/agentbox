# bb4: a remote browser that the agent drives, one for each user on a
# browser server (README, Remote browser (bb4)). Two MCP servers:
#   bb4           the server of the browser server, which starts the
#                 browser and sets it up; remote, through squid
#   bb4-devtools  pages in that browser: chrome-devtools-mcp behind
#                 supergateway in the sidecar ab-mcp-bb4-devtools, which
#                 nginx ab-mcp-bb4 guards with the caller token (mcp.sh)
# The browser server tells users apart by the name in the path. It has no
# authentication of its own. The image of ab-mcp-bb4-devtools is not in
# [images]: mcp.sh builds it here.
format = 1
description = "A remote browser on the browser server"
# The key between nginx and supergateway. mcp_start makes it.
own_secrets = ["bridge_key"]
egress = ["{BB4_URL.hostport}"]

[settings.BB4_URL]
required = true
check = "url-base"
help = "the MCP base URL of the browser server: the scheme, the host and the port only (http://browser.example.internal:5101)"

[settings.BB4_USER]
required = true
check = "name"
help = "your user name on the browser server (your GitHub user name)"

[settings.BB4_DEVTOOLS_PORT]
default = "5100"
check = "port"
help = "the port of the DevTools (CDP) WebSocket of the browser, on the host of BB4_URL"

[[servers]]
name = "bb4"
url = "{BB4_URL.base}/u/{BB4_USER}/mcp"
description = "The remote browser on the browser server: start it, set it up"

[[servers]]
name = "bb4-devtools"
url = "http://ab-mcp-bb4:8080/mcp"
caller = true
description = "Pages in the remote browser: open, read, click, type, screenshots"
